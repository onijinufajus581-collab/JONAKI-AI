
name: Build JONAKI AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir extracted
          unzip -o JONAKI_AI_TERMUX_PROJECT.zip -d extracted
          APP_BUILD=$(find extracted -path '*/app/build.gradle' | head -n 1)
          if [ -z "$APP_BUILD" ]; then
            echo "Could not find app/build.gradle in ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$(dirname "$APP_BUILD")")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JONAKI-AI-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
